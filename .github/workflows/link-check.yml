name: Link Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - .github/workflows/link-check.yml
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check maintained links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept '100..=103,200..=299,403,429,500..=599'
            --accept-timeouts
            --exclude-path docs/archived-links.md
            --exclude '^https://github.com/WayneZ01/Android_open_project/actions/workflows/'
            './**/*.md'
          fail: true
